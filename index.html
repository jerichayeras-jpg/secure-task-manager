<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Secure Dynamic Task Manager</h1>
    
    <div>
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addTaskBtn">Add Task</button>
        <button id="loadSampleBtn">Load Sample Tasks</button>
        <div id="taskMessage" style="color:red; display:none;"></div>
    </div>

    <ul id="taskList"></ul>

    <div>
        <span>Total: <span id="totalCount">0</span></span> | 
        <span>Pending: <span id="pendingCount">0</span></span> | 
        <span>Completed: <span id="completedCount">0</span></span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
